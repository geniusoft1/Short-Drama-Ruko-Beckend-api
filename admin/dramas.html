<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dramas — Ruko Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .drama-title-cell { display: flex; align-items: center; gap: 12px; }
    .drama-title-cell img { width: 40px; height: 56px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--bg-elevated); }
    .drama-title-cell .name { font-weight: 600; font-size: 14px; color: var(--text-primary); }
    .drama-title-cell .source { font-size: 11px; color: var(--text-muted); }
    .filters { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .filters select { width: auto; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="sidebar-logo">
          <div class="logo-icon">🎬</div>
          <div><div class="logo-text">Ruko</div><div class="logo-badge">ADMIN</div></div>
        </a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="sources.html" class="nav-item"><span class="nav-icon">🌐</span> Sources</a>
        <a href="dramas.html" class="nav-item active"><span class="nav-icon">🎭</span> Dramas</a>
        <a href="episodes.html" class="nav-item"><span class="nav-icon">📺</span> Episodes</a>
        <a href="downloads.html" class="nav-item"><span class="nav-icon">📥</span> Downloads</a>
        <div class="nav-section-label" style="margin-top:16px">Settings</div>
        <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span> Settings</a>
        <a href="api-keys.html" class="nav-item"><span class="nav-icon">🔑</span> API Keys</a>
      </nav>
      <div class="sidebar-footer">
        <div class="admin-info">
          <div class="admin-avatar" id="admin-avatar">A</div>
          <div><div class="admin-name" id="admin-username">Admin</div><div class="admin-role" id="admin-role">Super Admin</div></div>
        </div>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">
          <h1>🎭 Drama Library</h1>
          <p id="drama-count">Loading dramas...</p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary" onclick="openModal('add-drama-modal')">➕ Add Drama</button>
        </div>
      </header>

      <div class="page-content">
        <!-- Filters -->
        <div class="filters">
          <div class="search-bar" style="flex:1; min-width: 220px;">
            <span>🔍</span>
            <input type="text" placeholder="Search dramas..." id="search-input" oninput="debouncedSearch()">
          </div>
          <select class="form-control" id="filter-status" onchange="loadDramas(1)">
            <option value="">All Status</option>
            <option value="published">Published</option>
            <option value="hidden">Hidden</option>
          </select>
          <select class="form-control" id="sort-by" onchange="loadDramas(1)">
            <option value="latest">Latest</option>
            <option value="rating">Top Rated</option>
            <option value="title">A-Z</option>
          </select>
        </div>

        <!-- Table -->
        <div class="card" style="padding: 0; overflow: hidden;">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Drama</th>
                  <th>Genre</th>
                  <th>Episodes</th>
                  <th>Rating</th>
                  <th>Status</th>
                  <th>Published</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="dramas-tbody">
                <tr><td colspan="7" style="text-align:center; padding: 40px; color: var(--text-muted);">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
          <span id="page-info" style="color: var(--text-muted); font-size: 13px;"></span>
          <div class="pagination-btns" id="page-btns"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Drama Modal -->
  <div class="modal-overlay" id="edit-drama-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">✏️ Edit Drama</div>
        <button class="modal-close" onclick="closeModal('edit-drama-modal')">✕</button>
      </div>
      <form id="edit-drama-form">
        <input type="hidden" id="edit-drama-id">
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" id="edit-title" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="edit-description" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Poster URL</label>
          <input type="url" id="edit-poster" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="edit-status" class="form-control">
            <option>Ongoing</option>
            <option>Completed</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Visibility</label>
          <select id="edit-published" class="form-control">
            <option value="1">Published (Visible to Ruko app)</option>
            <option value="0">Hidden</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-full">💾 Save Changes</button>
      </form>
    </div>
  </div>

  <!-- Add Drama Modal -->
  <div class="modal-overlay" id="add-drama-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">➕ Add Drama Manually</div>
        <button class="modal-close" onclick="closeModal('add-drama-modal')">✕</button>
      </div>
      <form id="add-drama-form">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input type="text" id="add-title" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="add-description" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Poster URL</label>
          <input type="url" id="add-poster" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Genre (comma separated)</label>
          <input type="text" id="add-genre" class="form-control" placeholder="Romance, Drama, Thriller">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">Total Episodes</label>
            <input type="number" id="add-episodes" class="form-control" value="0">
          </div>
          <div class="form-group">
            <label class="form-label">Year</label>
            <input type="number" id="add-year" class="form-control" value="2024">
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full">➕ Add Drama</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initSidebar();
    let currentPage = 1;
    let currentDramaId = null;
    const debouncedSearch = debounce(() => loadDramas(1), 500);



    async function loadDramas(page = 1) {
      currentPage = page;
      const search = document.getElementById('search-input').value.trim();
      const status = document.getElementById('filter-status').value;

      try {
        const res = await api.getDramas({ page, limit: 25, search, status });
        const { data, pagination } = res;
        
        document.getElementById('drama-count').textContent = `${pagination.total} dramas total`;

        const tbody = document.getElementById('dramas-tbody');
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-state-icon">🎭</div><h3>No dramas found</h3><p>Sync a source or add dramas manually</p></div></td></tr>';
          return;
        }

        tbody.innerHTML = data.map(d => `
          <tr>
            <td>
              <div class="drama-title-cell">
                <img src="${d.poster || ''}" alt="" onerror="this.style.display='none'">
                <div>
                  <div class="name">${d.title}</div>
                  <div class="source">${d.source_name || 'Manual'}</div>
                </div>
              </div>
            </td>
            <td>${genresBadges(d.genre)}</td>
            <td><span class="badge badge-secondary">${d.total_episodes} eps</span></td>
            <td><span style="color: var(--warning)">⭐ ${d.rating ? d.rating.toFixed(1) : '—'}</span></td>
            <td>${statusBadge(d.status || 'Ongoing')}</td>
            <td>
              <label class="toggle">
                <input type="checkbox" ${d.is_published ? 'checked' : ''} onchange="togglePublish(${d.id}, this.checked)">
                <span class="toggle-slider"></span>
              </label>
            </td>
            <td>
              <div style="display: flex; gap: 6px;">
                <button class="btn btn-secondary btn-sm btn-icon" onclick="triggerDownload(${d.id})" title="Download to Bunny Storage">☁️</button>
                <button class="btn btn-secondary btn-sm btn-icon" onclick="editDrama(${d.id})" title="Edit">✏️</button>
                <a href="episodes.html?drama=${d.id}" class="btn btn-secondary btn-sm btn-icon" title="Episodes">📺</a>
                <button class="btn btn-danger btn-sm btn-icon" onclick="deleteDrama(${d.id})" title="Delete">🗑️</button>
              </div>
            </td>
          </tr>
        `).join('');

        // Pagination
        document.getElementById('page-info').textContent = `Page ${pagination.page} of ${pagination.pages} (${pagination.total} total)`;
        const pagebtns = document.getElementById('page-btns');
        let btns = `<button class="page-btn" onclick="loadDramas(${Math.max(1, page-1)})" ${page <= 1 ? 'disabled' : ''}>← Prev</button>`;
        const startPage = Math.max(1, page - 2);
        const endPage = Math.min(pagination.pages, page + 2);
        for (let i = startPage; i <= endPage; i++) {
          btns += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="loadDramas(${i})">${i}</button>`;
        }
        btns += `<button class="page-btn" onclick="loadDramas(${Math.min(pagination.pages, page+1)})" ${page >= pagination.pages ? 'disabled' : ''}>Next →</button>`;
        pagebtns.innerHTML = btns;
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function togglePublish(id, published) {
      try {
        await api.updateDrama(id, { is_published: published });
        toast(published ? 'Drama published' : 'Drama hidden', 'success');
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function editDrama(id) {
      try {
        const res = await api.getDrama(id);
        const d = res.data;
        document.getElementById('edit-drama-id').value = d.id;
        document.getElementById('edit-title').value = d.title;
        document.getElementById('edit-description').value = d.description || '';
        document.getElementById('edit-poster').value = d.poster || '';
        document.getElementById('edit-status').value = d.status || 'Ongoing';
        document.getElementById('edit-published').value = d.is_published ? '1' : '0';
        openModal('edit-drama-modal');
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    document.getElementById('edit-drama-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-drama-id').value;
      try {
        await api.updateDrama(id, {
          title: document.getElementById('edit-title').value,
          description: document.getElementById('edit-description').value,
          poster: document.getElementById('edit-poster').value,
          status: document.getElementById('edit-status').value,
          is_published: parseInt(document.getElementById('edit-published').value),
        });
        toast('Drama updated!', 'success');
        closeModal('edit-drama-modal');
        loadDramas(currentPage);
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    document.getElementById('add-drama-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const genre = document.getElementById('add-genre').value.split(',').map(g => g.trim()).filter(Boolean);
        await api.createDrama({
          title: document.getElementById('add-title').value,
          description: document.getElementById('add-description').value,
          poster: document.getElementById('add-poster').value,
          genre,
          total_episodes: parseInt(document.getElementById('add-episodes').value),
          year: parseInt(document.getElementById('add-year').value),
        });
        toast('Drama added!', 'success');
        closeModal('add-drama-modal');
        document.getElementById('add-drama-form').reset();
        loadDramas(1);
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    async function deleteDrama(id) {
      if (!confirm('Are you sure you want to delete this drama and all its episodes?')) return;
      try {
        await api.deleteDrama(id);
        toast('Drama deleted', 'success');
        loadDramas(currentPage);
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function triggerDownload(id) {
      if (!confirm('Start downloading this drama to your Bunny Storage? This will happen in the background.')) return;
      try {
        const res = await api.downloadDrama(id);
        toast(res.message, 'success');
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    loadDramas();
  </script>
</body>
</html>
